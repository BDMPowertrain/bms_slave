name: CI

# Rebuilt directly from upstream nguyen-v/KDT_Hierarchical_KiBot's own
# ci.yaml, applying: (1) KiCad 10 only, no more 8/9/10 branching — every "if
# kicad_version == X" step collapses to one; (2) the Node.js 20 deprecation
# action-version bumps from upstream PR #15, EXCEPT git-auto-commit-action,
# deliberately kept at the same v5 upstream uses — see the note on "Update
# Outputs" below; (3) releases are triggered by configure.py setting
# kibot_variant: RELEASED + release_version, NOT by pushing a tag — see
# "Releases" below. Everything else, including the separate notes/README
# pre-pass before the main group, matches upstream's structure: several
# rounds of "simplifying" this ourselves each introduced a new bug upstream's
# actual working version doesn't have.
#
# Note: a local test run failed on "Missing ... drill_table.csv" — this
# turned out to be the test board genuinely having zero vias/holes at the
# time (nothing to drill), not a workflow bug. Confirm the board you're
# testing against actually has a drillable feature before treating that
# error as a pipeline problem.
#
# Releases: a push (to dev, normally) where kibot_variant is RELEASED and
# release_version names a version with no tag yet is a release run:
#   1. CHANGELOG.md's [Unreleased] section is renamed to [release_version]
#   2. Outputs are built as RELEASED (ERC/DRC enforced) with that REVISION
#   3. Outputs + CHANGELOG are committed to the pushed branch as usual
#   4. main is moved to a merge commit whose tree is exactly that commit's
#   5. The release job tags that main commit and creates the GitHub Release
# Once the tag exists, later pushes with the same release_version just build
# as CHECKED, so leaving the stage at RELEASED never re-releases anything.
# Tag pushes used to be the trigger; they silently did nothing whenever the
# tag didn't match the pattern exactly (e.g. `v1.0.0`), so they're gone.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - '*.md'

env:
  kibot_config: kibot_yaml/kibot_main.yaml
  # Used variant and release version. These two lines are the ONLY thing
  # configure.py (stage menu) changes in this file. We assume:
  # DRAFT: only schematic in progress, will only generate schematic PDF, netlist and BoM
  # PRELIMINARY: will generate both schematic and PCB documents, but no ERC/DRC
  # CHECKED: will generate both schematic and PCB documents, with ERC/DRC
  # RELEASED: same as CHECKED, then releases release_version (see "Releases" above)
  kibot_variant: DRAFT
  release_version: ""

  kibot_log: kibot_run.log

permissions:
  contents: write

jobs:
  release:
    needs: generate_outputs
    runs-on: ubuntu-latest
    if: needs.generate_outputs.outputs.is_release == 'true'
    steps:
      # The exact main commit generate_outputs pushed, not whatever main
      # points at by now, so the tag and the attached files always match.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.generate_outputs.outputs.release_sha }}

      # No `prerelease:` here: the [Unreleased] section was already renamed
      # to [release_version] by generate_outputs, so this picks up that
      # newest released section.
      - name: Extract release notes
        uses: ffurrer2/extract-release-notes@v3
        id: extract-release-notes

      # Creates the tag at target_commitish as part of creating the release.
      # A tag pushed with GITHUB_TOKEN never triggers another workflow run.
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.release_version }}
          target_commitish: ${{ needs.generate_outputs.outputs.release_sha }}
          name: ${{ env.release_version }}
          body: ${{ steps.extract-release-notes.outputs.release_notes }}
          files: |
            Schematic/*.pdf
            Manufacturing/Assembly/*
            Manufacturing/Fabrication/*.pdf
            Manufacturing/Fabrication/*.zip
            Manufacturing/Fabrication/*.txt
            3D/*.step
            Testing/Testpoints/*.csv

  generate_outputs:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'Merge pull request')"
    outputs:
      is_release: ${{ steps.determine-version-and-args.outputs.is_release }}
      release_sha: ${{ steps.publish-main.outputs.sha }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Deliberate deviation from upstream KDT, which doesn't do this: delete
      # every previously-generated output before regenerating. Without it, a
      # file that stops being relevant (e.g. a drill table for a via that no
      # longer exists on the board) just sits there forever, since nothing
      # else would ever remove it, and it would keep getting silently
      # re-committed as if it were still current.
      - name: Clean previous generated outputs
        run: |
          rm -rf Manufacturing Schematic 3D Testing Reports
          # Images/ keeps a tracked .gitkeep so the empty dir survives in git
          # between runs (KiBot never recreates it) — clean only the PNGs
          # KiBot generates into it, not the directory itself.
          rm -f Images/*.png

      # effective_variant, not $kibot_variant, drives everything below.
      # `echo "kibot_variant=..." >> $GITHUB_ENV` only takes effect in the
      # NEXT step — this script's own $kibot_variant stays at the static
      # value for its entire remaining run. Branching the case statement
      # below on $kibot_variant once computed notes_skip for the wrong
      # variant, giving an EMPTY notes_skip, which breaks the action's own
      # command-building (`-s` with nothing after it shifts every argument
      # after it — the "Unknown output/group `variant=RELEASED`" crash).
      #
      # last_tag comes from `git tag --sort`, not `git describe`: release
      # tags sit on main's merge commits, which are never ancestors of dev,
      # so describe would never find them from a dev push.
      - name: Determine VERSION Argument and Variant
        id: determine-version-and-args
        run: |
          last_tag=$(git tag -l '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          effective_variant="$kibot_variant"
          is_release=false
          if [[ "$kibot_variant" == "RELEASED" ]]; then
            if [[ ! "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::kibot_variant is RELEASED but release_version ('${release_version}') isn't X.Y.Z. Set it with configure.py."
              exit 1
            fi
            if git rev-parse -q --verify "refs/tags/${release_version}" >/dev/null; then
              # If THIS push is the one that set release_version, the tag
              # predates it (a leftover from a manual tag, or a version that
              # was already used), so quietly building as CHECKED would look
              # like the release just "didn't happen". Fail instead.
              before="${{ github.event.before }}"
              prev=$(git show "${before}:.github/workflows/ci.yaml" 2>/dev/null | grep -m1 -E '^\s*release_version:' || true)
              now=$(grep -m1 -E '^\s*release_version:' .github/workflows/ci.yaml || true)
              if [[ "${{ github.event_name }}" == "push" && "$prev" != "$now" ]]; then
                echo "::error::Tag ${release_version} already exists (on commit $(git rev-list -n1 "${release_version}" | cut -c1-7)), so this push can't release it. Delete the old tag (git push origin --delete ${release_version}) and push again, or pick a higher version with configure.py."
                exit 1
              fi
              echo "::notice::${release_version} is already released; building as CHECKED. Use configure.py to set the next version when it's time to release again."
              effective_variant="CHECKED"
            else
              is_release=true
              echo "Release run for ${release_version}"
            fi
          fi

          # The CI badge in README.md needs an actual branch name in its URL
          # (badge.svg?branch=<name>) — a release ends up on main, so point
          # it there.
          if $is_release; then
            version_arg="-E REVISION='${release_version}' -E BRANCH='main'"
          else
            version_arg="-E REVISION='${last_tag}+ (Unreleased)' -E BRANCH='${{ github.ref_name }}'"
          fi
          echo "kibot_variant=${effective_variant}" >> $GITHUB_ENV
          echo "is_release=${is_release}" >> $GITHUB_OUTPUT

          # Determine additional_args based on the variant. notes_skip
          # mirrors kibot_launch.sh's per-variant skip-pre lists for the
          # "notes" pass exactly — it must NEVER include `all` here. `-s`/
          # `skip:` on the action IS `--skip-pre` (confirmed against
          # `kibot --help`), so `skip: all` skips update_xml too, and this
          # "Generate notes" step is what's supposed to run update_xml FIRST
          # so the second step's set_text_variables (which always runs
          # before update_xml within a single invocation — priority 90 vs
          # 50) finds the sheet-title XML already written. Skipping `all`
          # here means the SECOND step's set_text_variables runs with no
          # XML on disk yet, and every SHEET_NAME_* variable gets written as
          # the literal text "Error: XML File not found" — which then gets
          # committed straight into the .kicad_pro. (Confirmed root cause of
          # the same bug recurring on 2026-09-10.)
          case "$effective_variant" in
            "DRAFT")
              additional_args="--skip-pre draw_fancy_stackup,erc,drc ${version_arg} --log ${{ env.kibot_log }} draft_group"
              notes_skip=""
              ;;
            "PRELIMINARY")
              additional_args="--skip-pre erc,drc ${version_arg} --log ${{ env.kibot_log }} all_group"
              notes_skip="erc,drc"
              ;;
            "CHECKED"|"RELEASED")
              additional_args="${version_arg} --log ${{ env.kibot_log }} all_group"
              notes_skip="set_text_variables,draw_fancy_stackup,erc,drc"
              ;;
            *)
              echo "Unknown variant: $effective_variant"
              exit 1
              ;;
          esac

          echo "version_arg=${version_arg}" >> $GITHUB_ENV
          echo "additional_args=${additional_args}" >> $GITHUB_ENV
          echo "notes_skip=${notes_skip}" >> $GITHUB_ENV

      # Runs before KiBot so the Revision History sheet (get_changelog.py
      # reads CHANGELOG.md) sees the renamed [x.y.z] section, not
      # [Unreleased]. The edit is left uncommitted on purpose: "Update
      # Outputs" below commits it together with the outputs.
      - name: Update changelog
        if: steps.determine-version-and-args.outputs.is_release == 'true'
        uses: thomaseizinger/keep-a-changelog-new-release@v3
        with:
          tag: ${{ env.release_version }}

      - name: Cache 3D models data
        id: models-cache
        uses: actions/cache@v5
        with:
          path: ~/cache_3d
          key: cache_3d

      # Generate notes (skipped for DRAFT variant)
      - name: Generate notes (KiCad 10)
        if: env.kibot_variant != 'DRAFT'
        uses: INTI-CMNB/KiBot@v2_dk10
        with:
          skip: ${{ env.notes_skip }}
          variant: ${{ env.kibot_variant }}
          config: ${{ env.kibot_config }}
          additional_args: ${{ env.version_arg }} --log kibot_run_notes.log notes

      # Generate README only (only for DRAFT variant). Deliberately does NOT
      # skip set_text_variables like upstream's original does — that
      # preflight is what fills in BOARD_NAME/PROJECT_NAME/DESCRIPTION/
      # GIT_URL/COMPANY/DESIGNER; skipping it left the DRAFT-stage README
      # showing stale placeholder text and a broken CI badge (empty
      # GIT_URL), confirmed from a real generated run.
      - name: Generate README only (KiCad 10)
        if: env.kibot_variant == 'DRAFT'
        uses: INTI-CMNB/KiBot@v2_dk10
        with:
          skip: draw_fancy_stackup,erc,drc
          variant: ${{ env.kibot_variant }}
          config: ${{ env.kibot_config }}
          additional_args: ${{ env.version_arg }} --log kibot_run_readme.log readme_group

      # Generate outputs
      #
      # A board with zero drillable holes anywhere (no vias, no through-hole
      # parts) WILL fail here — this isn't recoverable from CI config. KiBot's
      # pdf_fabrication drill map assumes at least one hole layer pair always
      # exists and crashes (IndexError in draw_drill_map) when it doesn't,
      # and there's no way to route around that without permanently dropping
      # the drill-map page for every board. See the README's "Hard
      # requirement" note in CI/CD, Variants, and the Changelog: a board
      # needs at least one via or through-hole part before PRELIMINARY+.
      - name: Generate outputs (KiCad 10)
        uses: INTI-CMNB/KiBot@v2_dk10
        with:
          additional_args: ${{ env.additional_args }}
          variant: ${{ env.kibot_variant }}
          config: ${{ env.kibot_config }}
          cache3D: YES

      # The KiBot action's docker run creates every generated file as root
      # (it's a bind-mounted volume) — everything from this point on runs
      # directly on the runner as the unprivileged `runner` user. Without
      # this, later git steps fail with "Permission denied" trying to
      # unlink/overwrite those root-owned files (confirmed from a real run).
      - name: Fix file ownership (KiBot's docker run leaves files as root)
        run: sudo chown -R $(id -u):$(id -g) .

      - name: Pull latest changes
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git pull origin ${{ github.ref_name }} --tags --force

      - name: Discard changes to .kicad_pcb files and remove temp files
        run: |
          git checkout HEAD -- $(git ls-files "*.kicad_pcb")
          git clean -f "*.kicad_pcb"
          git clean -f "*.kicad_pro"
          git clean -f "*.kicad_dru"
          git clean -f "*.kicad_prl"

      # No file_pattern: commits everything that actually changed, whatever
      # that is for this run's variant. This is the upstream default and
      # it's deliberate — every attempt at hand-listing "the" output paths
      # here has broken on some variant that doesn't produce all of them
      # (DRAFT never creates Manufacturing/, 3D/, Testing/, or Reports/, and
      # git add fails hard, not silently, on a pattern matching zero files).
      # Kept at v5, matching upstream exactly — the Node 20 warning this
      # triggers is cosmetic (GitHub runs it on Node 24 regardless); v7
      # changed detached-HEAD handling in a way we haven't independently
      # verified is safe for this exact job shape, and this step is the one
      # thing the whole pipeline depends on actually working.
      - name: Update Outputs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: ${{ github.ref_name }}
          commit_message: ${{ steps.determine-version-and-args.outputs.is_release == 'true' && format('Update Outputs (release {0})', env.release_version) || 'Update Outputs' }}

      # Requires github-actions[bot] on main's branch-protection bypass list
      # (Settings -> Branches -> your `main` rule -> allow bypass), since
      # this pushes straight to main.
      # Not a `git merge`: main's tree is set to exactly the commit just
      # pushed above, with that commit and old main as the two parents. A
      # real merge (even -X theirs) can still stop on delete/modify
      # conflicts and could keep files dev has since removed; this can't
      # conflict, and main still shows every release as one merge commit.
      - name: Publish release commit to main
        id: publish-main
        if: steps.determine-version-and-args.outputs.is_release == 'true'
        run: |
          git fetch origin '+refs/heads/main:refs/remotes/origin/main' || true
          if git rev-parse -q --verify refs/remotes/origin/main >/dev/null; then
            parents="-p origin/main -p HEAD"
          else
            parents="-p HEAD"
          fi
          sha=$(git commit-tree "HEAD^{tree}" $parents -m "Release ${release_version}")
          git push origin "${sha}:refs/heads/main"
          echo "sha=${sha}" >> $GITHUB_OUTPUT

      - name: Store log
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: log_file
          path: ${{ env.kibot_log }}

      - name: Store notes log
        if: ${{ always() && env.kibot_variant != 'DRAFT' }}
        uses: actions/upload-artifact@v7
        with:
          name: log_file_notes
          path: kibot_run_notes.log

      - name: Store README log
        if: ${{ always() && env.kibot_variant == 'DRAFT' }}
        uses: actions/upload-artifact@v7
        with:
          name: log_file_readme
          path: kibot_run_readme.log
